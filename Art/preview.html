<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Flavor Text Extended Preview</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 896px; height: 504px; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, sans-serif; background: url("Preview.png") center / cover; }
.veil { position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, #291E13 96%, transparent) 0%, color-mix(in srgb, #291E13 94%, transparent) 48%, transparent 83%); }
.copy { position: absolute; left: 50px; top: 54px; color: #F2ECE1; text-shadow: 0 3px 10px rgba(0,0,0,.75); }
h1 { margin: 0; font-size: 46px; font-weight: 600; line-height: 1.1; letter-spacing: 0; }
h1 span { font-size: .65em; color: #E3B580; }
.rule { width: 58px; height: 3px; background: #A6CB3A; margin: 20px 0 16px; }
p { margin: 0; width: 430px; font-size: 21px; font-weight: 400; line-height: 1.45; }
.badge { position: absolute; right: 0; top: 0; width: 80px; height: 80px; background: #A6CB3A; clip-path: polygon(0 0,100% 0,100% 100%); }
.version { position: absolute; left: 869px; top: 27px; transform: translate(-50%,-50%) rotate(45deg); color: #17120E; font-size: 26px; font-weight: 700; line-height: 1; }
</style>
<div class="veil"></div>
<div class="copy"><h1>Flavor Text <span>Extended</span></h1><div class="rule"></div><p>New dishes for Flavor Text, French and regional cooking first.</p></div>
<div class="badge"></div><div class="version">1.6</div>
<script>document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });</script>
</html>
